    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant%20Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css?v=20260920-2">
    <style>
        .category-tabs {
            display: flex; gap: 10px; justify-content: center;
            flex-wrap: wrap; margin-bottom: 30px;
        }
        .tab {
            padding: 8px 20px; border-radius: var(--radius-pill);
            border: 2px solid var(--primary-light); background: transparent;
            color: var(--text); font-weight: 600; cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab:hover, .tab.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; border-color: transparent; box-shadow: var(--glow);
        }
        .resources-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px;
        }
        .resource-card {
            background: var(--card-bg); border-radius: var(--radius);
            padding: 24px; box-shadow: var(--shadow);
            border: 1px solid rgba(235,212,240,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex; gap: 16px; align-items: flex-start;
            cursor: pointer; text-decoration: none; color: inherit;
        }
        .resource-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(168,140,190,0.2);
        }
        .resource-icon {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; box-shadow: var(--glow);
        }
        .resource-icon i { font-size: 1.3rem; color: white; }
        .resource-info h3 { font-size: 1.1rem; margin-bottom: 6px; color: var(--text); }
        .resource-info p { color: var(--text-light); font-size: 0.9rem; line-height: 1.5; }
        .resource-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
        .resource-tag {
            background: var(--primary-light); color: var(--primary-dark);
            padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">跳到主要内容</a>

    <nav class="navbar" role="navigation" aria-label="主导航">
        <a href="index.html" class="logo">
            <div class="logo-icon" aria-hidden="true"><span class="logo-letter">E</span></div>
            <span>Elysia</span>
        </a>
        <button class="hamburger" aria-label="菜单" aria-expanded="false" aria-controls="nav-links"><i class="fas fa-bars" aria-hidden="true"></i></button>
        <div class="nav-links" id="nav-links">
            <a href="index.html">首页</a>
            <a href="explore.html">工具</a>
            <a href="games.html">小游戏</a>
            <a href="resources.html" class="active">资源</a>
            <div class="volume-control">
                <button id="volumeBtn" class="volume-icon" aria-label="音乐控制"><i class="fas fa-music" aria-hidden="true"></i></button>
            </div>
        </div>
    </nav>

    <main id="main-content">
        <div class="page-container">
            <h1 class="section-title" style="margin-top:20px;">资源</h1>
            <div class="category-tabs" id="category-tabs" role="tablist" aria-label="资源分类">
                <button class="tab active" data-cat="all" role="tab" aria-selected="true">全部</button>
            </div>
            <div class="resources-grid" id="resources-grid" role="tabpanel">
                <div class="loading"><i class="fas fa-spinner" aria-hidden="true"></i><p>加载中...</p></div>
            </div>
        </div>
    </main>

    <footer class="footer" role="contentinfo">
        <div class="copyright">
            <p>&copy; 2026 Elysia · Personal Space | 一些实用的小东西，安静地放在这里。</p>
        </div>
    </footer>

    <audio id="bgm" loop preload="none">
        <source src="assets/music/致爱 A Song For Beloved - 宴宁_徐鲤.mp3" type="audio/mpeg">
    </audio>
    <script src="common.js"></script>
    <script>
        const FALLBACK_RESOURCES = [
            {"id":"example-resource","name":"示例资源","description":"这是一个示例资源条目，展示如何添加资源到资源。","icon":"fas fa-gem","category":"素材","type":"link","url":"#","tags":["示例","模板"]}
        ];

        let allResources = [];

        document.addEventListener('DOMContentLoaded', async () => {
            let loaded = await loadManifest('resources/manifest.json');
            allResources = loaded.length ? loaded : FALLBACK_RESOURCES;
            buildCategoryTabs(allResources);
            renderResourceCards(allResources);
        });

        function buildCategoryTabs(items) {
            const cats = [...new Set(items.map(r => r.category || '未分类'))];
            const tabs = document.getElementById('category-tabs');
            cats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'tab';
                btn.dataset.cat = cat;
                btn.textContent = cat;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', () => filterByCategory(cat));
                tabs.appendChild(btn);
            });
            tabs.querySelector('[data-cat="all"]').addEventListener('click', () => {
                setActiveTab('all');
                renderResourceCards(allResources);
            });
        }

        function filterByCategory(cat) {
            setActiveTab(cat);
            renderResourceCards(allResources.filter(r => (r.category || '未分类') === cat));
        }

        function setActiveTab(cat) {
            document.querySelectorAll('.tab').forEach(t => {
                const isActive = t.dataset.cat === cat;
                t.classList.toggle('active', isActive);
                t.setAttribute('aria-selected', isActive);
            });
        }

        function renderResourceCards(items) {
            const grid = document.getElementById('resources-grid');
            renderCards(items, grid, item => `
                <a href="${item.url || '#'}" class="resource-card" target="_blank" rel="noopener">
                    <div class="resource-icon"><i class="${item.icon || 'fas fa-gem'}" aria-hidden="true"></i></div>
                    <div class="resource-info">
                        <h3>${item.name}</h3>
                        <p>${item.description || ''}</p>
                        <div class="resource-tags">
                            ${(item.tags || []).map(t => `<span class="resource-tag">${t}</span>`).join('')}
                        </div>
                    </div>
                </a>
            `);
        }
    </script>
</body>
</html>
